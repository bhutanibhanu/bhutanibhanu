<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t">
<title id="t">Lab notebook cover: Bhanu Pratap, M.S. Artificial Intelligence, Northeastern University, graduating December 2026. Stamped: open to roles from January 2027.</title>
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.serif { font-family: Georgia, "Times New Roman", Times, serif; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.label { font-size: 16px; letter-spacing: 3px; fill: #575d6b; }
.page { font-size: 16px; fill: #8a8578; }
.name { font-size: 68px; font-weight: 700; fill: #1d2433; }
.program { font-size: 27px; font-style: italic; fill: #1d2433; }
.thesis { font-size: 22px; fill: #575d6b; }
.prompt { fill: #2a5bd7; }
.pencil { font-size: 21px; fill: #8a8578; }
.stamp-big { font-size: 25px; font-weight: 700; letter-spacing: 2px; fill: #c43d3a; }
.stamp-small { font-size: 22px; font-weight: 700; letter-spacing: 2px; fill: #c43d3a; }
.ink-line {
  fill: none; stroke: #2a5bd7; stroke-width: 4.5; stroke-linecap: round;
  stroke-dasharray: 520; stroke-dashoffset: 0;
  animation: draw 1.6s ease-out 0.3s both;
}
@keyframes draw { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .ink-line { animation: none; } }
</style>
<defs>
