<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="t">
<title id="t">Instant Notes, wait after you stop talking: local Whisper on CPU 79 s, Groq Whisper batch 787 ms, streamed during recording 78 ms.</title>
<style>
