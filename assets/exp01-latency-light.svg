.serif { font-family: Georgia, "Times New Roman", Times, serif; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.title { font-size: 32px; font-weight: 600; fill: #1d2433; }
.sub { font-size: 20px; fill: #575d6b; }
.row { font-size: 21px; fill: #1d2433; }
.tick { font-size: 17px; fill: #575d6b; font-variant-numeric: tabular-nums; }
.value { font-size: 21px; font-weight: 600; fill: #1d2433; }
.note { font-size: 19px; fill: #575d6b; }
.hero { font-size: 48px; font-weight: 600; fill: #1d2433; }
</style>
<rect width="960" height="350" rx="14" fill="#fbf8f1"/>
