<line x1="635" y1="128" x2="635" y2="292" stroke="#e8e1d1" stroke-width="1"/>
<text x="635" y="322" class="mono tick" text-anchor="middle">1 s</text>
<line x1="777.5" y1="128" x2="777.5" y2="292" stroke="#e8e1d1" stroke-width="1"/>
