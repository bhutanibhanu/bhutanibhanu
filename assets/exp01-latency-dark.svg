.tick { font-size: 16px; fill: #a9b0bc; font-variant-numeric: tabular-nums; }
.value { font-size: 19px; font-weight: 600; fill: #e8ebf0; }
.note { font-size: 18px; font-weight: 400; fill: #a9b0bc; }
.hero { font-size: 40px; font-weight: 600; fill: #e8ebf0; }
.caption { font-size: 17px; fill: #a9b0bc; }
</style>
<rect width="600" height="330" rx="14" fill="#12161d"/>
